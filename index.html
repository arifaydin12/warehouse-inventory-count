                    <div className={`min-h-screen bg-gradient-to-br ${darkMode ? 'from-slate-800 via-blue-900 to-indigo-900' : 'from-slate-50 via-blue-50 to-indigo-100'} p-4 transition-colors duration-500 ${appClassName}`}>
                        <div className="max-w-3xl mx-auto animate-fade-in">
                            <div className="bg-white/80 backdrop-blur-xl rounded-3xl shadow-2xl p-8 mb-6 border border-white/20 dark:bg-gray-800/80 dark:border-gray-700">
                                <div className="flex items-center justify-between mb-8">
                                    <div className="flex items-center gap-4">
                                        <button
                                            onClick={() => {
                                                setCurrentScreen('dashboard');
                                                setEditingId(null);
                                                setCurrentCount({
                                                    barcode: '', productCode: '', productName: '', lotNumber: '', quantity: '', location: '', notes: ''
                                                });
                                                setBarcodeError(false); // Ekrandan çıkarken hatayı temizle
                                            }}
                                            className="w-12 h-12 bg-gray-100 hover:bg-gray-200 rounded-xl flex items-center justify-center transition-all hover:scale-105 dark:bg-gray-700 dark:hover:bg-gray-600"
                                        >
                                            <ChevronRight size={24} className="dark:text-white" style={{ transform: 'rotate(180deg)' }} />
                                        </button>
                                        <div>
                                            <h2 className="text-3xl font-bold bg-gradient-to-r from-indigo-600 to-purple-600 bg-clip-text text-transparent">
                                                {editingId ? T('update') : T('newCount')}
                                            </h2>
                                            <p className="text-gray-600 mt-1 dark:text-gray-400">{selectedWarehouse.name}</p>
                                        </div>
                                    </div>
                                    <div className="w-16 h-16 bg-gradient-to-br from-blue-500 to-indigo-600 rounded-2xl flex items-center justify-center shadow-xl floating">
                                        <Camera size={32} className="text-white" />
                                    </div>
                                </div>

                                {showSuccess && (
                                    <div className="mb-6 p-5 bg-gradient-to-r from-green-500 to-emerald-600 text-white rounded-2xl flex items-center gap-4 shadow-xl animate-slide-down">
                                        <div className="w-12 h-12 bg-white/20 backdrop-blur-sm rounded-xl flex items-center justify-center">
                                            <Check size={24} />
                                        </div>
                                        <div>
                                            <p className="font-bold text-lg">{T('successTitle')}</p>
                                            <p className="text-white/90 text-sm">{T('successCount')} {editingId ? T('successUpdated') : T('successAdded')}</p>
                                        </div>
                                    </div>
                                )}

                                {isLoading && (
                                    <div className="mb-6 p-5 bg-blue-50 rounded-2xl flex items-center gap-4 dark:bg-blue-900/50">
                                        <div className="w-8 h-8 border-4 border-blue-500 border-t-transparent rounded-full animate-spin"></div>
                                        <p className="text-gray-700 font-semibold dark:text-gray-300">{T('processing')}</p>
                                    </div>
                                )}

                                <div className="space-y-6">
                                    <div>
                                        <label className="block text-sm font-bold text-gray-700 mb-3 dark:text-gray-300">
                                            <div className="flex items-center gap-2">
                                                <Camera size={18} className="text-indigo-600" />
                                                {T('barcodeScan')}
                                            </div>
                                        </label>
                                        <div className="relative">
                                            <div className={`absolute left-4 top-1/2 transform -translate-y-1/2 w-10 h-10 rounded-lg flex items-center justify-center ${
                                                isProductFound ? 'bg-green-100' : isInvalidBarcode ? 'bg-red-100' : 'bg-indigo-100'
                                            }`}>
                                                {isProductFound ? <Check className="text-green-600" size={20} /> : <Camera className={`${isInvalidBarcode ? 'text-red-600' : 'text-indigo-600'}`} size={20} />}
                                            </div>
                                            <input
                                                ref={barcodeInputRef}
                                                type="text"
                                                placeholder={T('barcodePlaceholder')}
                                                value={currentCount.barcode}
                                                onChange={(e) => {
                                                    setCurrentCount({ ...currentCount, barcode: e.target.value });
                                                    parseBarcode(e.target.value);
                                                }}
                                                className={`w-full pl-16 pr-4 py-4 border-2 ${isInvalidBarcode ? 'border-red-500' : 'border-gray-300 dark:border-gray-600'} rounded-xl focus:border-indigo-500 focus:ring-4 focus:ring-indigo-100 focus:outline-none transition-all text-lg font-medium dark:bg-gray-700 dark:text-gray-200`}
                                            />
                                        </div>
                                        <p className={`text-xs mt-2 ${isInvalidBarcode ? 'text-red-500 font-bold' : 'text-gray-500 dark:text-gray-400'}`}>
                                            {isInvalidBarcode ? T('errorBarcode') : T('barcodePlaceholder')}
                                        </p>
                                    </div>

                                    {isProductFound && (
                                        <div className="animate-slide-up">
                                            <div className="bg-gradient-to-br from-indigo-50 to-purple-50 border-2 border-indigo-200 rounded-2xl p-6 shadow-inner dark:from-indigo-900/30 dark:to-purple-900/30 dark:border-indigo-700">
                                                <div className="flex items-center gap-2 mb-4">
                                                    <div className="w-8 h-8 bg-indigo-500 rounded-lg flex items-center justify-center">
                                                        <Check size={18} className="text-white" />
                                                    </div>
                                                    <p className="font-bold text-gray-800 dark:text-gray-200">{T('productInfo')}</p>
                                                </div>
                                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                                                    <div className="bg-white/60 backdrop-blur-sm rounded-xl p-4 dark:bg-gray-700/60">
                                                        <p className="text-xs text-indigo-600 font-bold mb-2 dark:text-indigo-400">{T('productCode')}</p>
                                                        <p className="text-xl font-bold text-gray-800 dark:text-gray-100">{currentCount.productCode}</p>
                                                    </div>
                                                    <div className="bg-white/60 backdrop-blur-sm rounded-xl p-4 dark:bg-gray-700/60">
                                                        <p className="text-xs text-purple-600 font-bold mb-2 dark:text-purple-400">{T('lotNumber')}</p>
                                                        <p className="text-xl font-bold text-gray-800 dark:text-gray-100">{currentCount.lotNumber}</p>
                                                    </div>
                                                </div>
                                                <div className="bg-white/60 backdrop-blur-sm rounded-xl p-4 dark:bg-gray-700/60">
                                                    <p className="text-xs text-indigo-600 font-bold mb-2 dark:text-indigo-400">{T('productName')}</p>
                                                    <p className="text-lg font-bold text-gray-800 dark:text-gray-100">{currentCount.productName}</p>
                                                </div>
                                            </div>

                                            <div className="grid grid-cols-1 md:grid-cols-2 gap-6 mt-6">
                                                <div>
                                                    <label className="block text-sm font-bold text-gray-700 mb-3 dark:text-gray-300">
                                                        <div className="flex items-center gap-2">
                                                            <Package size={18} className="text-green-600" />
                                                            {T('quantity')} *
                                                        </div>
                                                    </label>
                                                    {/* SIFIR HATA GİRİŞİ - Miktar Alanı */}
                                                    <input
                                                        type="number"
                                                        placeholder="1"
                                                        value={currentCount.quantity}
                                                        onChange={(e) => {
                                                            const val = e.target.value;
                                                            // Sadece pozitif tamsayı girişine izin ver
                                                            if (val === '' || (val.match(/^\d+$/) && parseInt(val) >= 0)) {
                                                                setCurrentCount({ ...currentCount, quantity: val });
                                                            }
                                                        }}
                                                        onBlur={(e) => {
                                                             const val = parseInt(e.target.value);
                                                             if (isNaN(val) || val <= 0) {
                                                                 // Hata durumunda uyarı
                                                                 alert(T('tip3').replace('**positive integer**', T('positiveInteger') || 'positive integer')); 
                                                                 setCurrentCount({ ...currentCount, quantity: '1' }); // Default 1 yap
                                                             }
                                                        }}
                                                        className={`w-full px-4 py-4 border-2 ${isInvalidQuantity ? 'border-red-500' : 'border-gray-300 dark:border-gray-600'} rounded-xl focus:border-green-500 focus:ring-4 focus:ring-green-100 focus:outline-none transition-all text-lg font-bold dark:bg-gray-700 dark:text-gray-200`}
                                                        min="1"
                                                    />
                                                    {isInvalidQuantity && <p className="text-xs mt-2 text-red-500 font-bold">Miktar 1'den büyük bir tam sayı olmalıdır.</p>}
                                                </div>
                                                <div>
                                                    <label className="block text-sm font-bold text-gray-700 mb-3 dark:text-gray-300">
                                                        <div className="flex items-center gap-2">
                                                            <MapPin size={18} className="text-orange-600" />
                                                            {T('locationInput')}
                                                        </div>
                                                    </label>
                                                    <input
                                                        type="text"
                                                        placeholder={T('locationPlaceholder')}
                                                        value={currentCount.location}
                                                        onChange={(e) => setCurrentCount({ ...currentCount, location: e.target.value })}
                                                        className="w-full px-4 py-4 border-2 border-gray-300 rounded-xl focus:border-orange-500 focus:ring-4 focus:ring-orange-100 focus:outline-none transition-all text-lg font-semibold dark:bg-gray-700 dark:border-gray-600 dark:text-gray-200"
                                                    />
                                                </div>
                                            </div>

                                            <div className="mt-6">
                                                <label className="block text-sm font-bold text-gray-700 mb-3 dark:text-gray-300">
                                                    <div className="flex items-center gap-2">
                                                        <FileText size={18} className="text-blue-600" />
                                                        {T('notes')}
                                                    </div>
                                                </label>
                                                <textarea
                                                    placeholder={T('notes').replace('(Opsiyonel)', '...')}
                                                    value={currentCount.notes}
                                                    onChange={(e) => setCurrentCount({ ...currentCount, notes: e.target.value })}
                                                    rows="3"
                                                    className="w-full px-4 py-3 border-2 border-gray-300 rounded-xl focus:border-blue-500 focus:ring-4 focus:ring-blue-100 focus:outline-none transition-all resize-none dark:bg-gray-700 dark:border-gray-600 dark:text-gray-200"
                                                />
                                            </div>

                                            <div className="flex gap-4 pt-6 mt-6 border-t border-gray-200 dark:border-gray-700">
                                                <button
                                                    onClick={handleSaveCount}
                                                    disabled={isLoading || !isProductFound || isInvalidBarcode || isInvalidQuantity || !currentCount.location}
                                                    className="flex-1 bg-gradient-to-r from-indigo-500 to-purple-600 hover:from-indigo-600 hover:to-purple-700 disabled:from-gray-400 disabled:to-gray-500 text-white rounded-xl py-5 font-bold shadow-xl hover:shadow-2xl transition-all duration-300 hover:-translate-y-1 disabled:cursor-not-allowed flex items-center justify-center gap-3 text-lg"
                                                >
                                                    {isLoading ? (
                                                        <>
                                                            <div className="w-6 h-6 border-3 border-white border-t-transparent rounded-full animate-spin"></div>
                                                            {T('processing')}
                                                        </>
                                                    ) : (
                                                        <>
                                                            <Check size={24} />
                                                            {editingId ? T('update') : T('save')}
                                                        </>
                                                    )}
                                                </button>
                                                {editingId && (
                                                    <button
                                                        onClick={() => {
                                                            setCurrentScreen('dashboard');
                                                            setEditingId(null);
                                                            setCurrentCount({
                                                                barcode: '', productCode: '', productName: '', lotNumber: '', quantity: '', location: '', notes: ''
                                                            });
                                                        }}
                                                        className="px-8 bg-gray-200 hover:bg-gray-300 text-gray-700 rounded-xl font-bold transition-all hover:scale-105 flex items-center gap-2 dark:bg-gray-700 dark:hover:bg-gray-600 dark:text-gray-200"
                                                    >
                                                        <X size={20} />
                                                        {T('cancel')}
                                                    </button>
                                                )}
                                            </div>
                                        </div>
                                    )}
                                </div>
                            </div>

                            {/* Quick Tips */}
                            <div className="bg-blue-50 border-2 border-blue-200 rounded-2xl p-6 dark:bg-blue-900/50 dark:border-blue-700">
                                <h3 className="font-bold text-gray-800 mb-3 flex items-center gap-2 dark:text-gray-100">
                                    <div className="w-6 h-6 bg-blue-500 rounded-lg flex items-center justify-center">
                                        <span className="text-white text-xs">💡</span>
                                    </div>
                                    {T('tipsHeader')}
                                </h3>
                                <ul className="space-y-2 text-sm text-gray-700 dark:text-gray-300">
                                    <li className="flex items-start gap-2">
                                        <Check size={16} className="text-blue-500 mt-0.5 flex-shrink-0" />
                                        <span>**{currentUser.role}** {T('tip1')}</span>
                                    </li>
                                    <li className="flex items-start gap-2">
                                        <Check size={16} className="text-blue-500 mt-0.5 flex-shrink-0" />
                                        <span>{T('tip2')}</span>
                                    </li>
                                    <li className="flex items-start gap-2">
                                        <Check size={16} className="text-blue-500 mt-0.5 flex-shrink-0" />
                                        <span>{T('tip3')}</span>
                                    </li>
                                </ul>
                            </div>
                        </div>
                    </div>
                );
            }

            return null;
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
