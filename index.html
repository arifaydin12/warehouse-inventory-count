        // ==========================================
        // DATABASE SYSTEM v3.0 - IndexedDB Manager
        // ==========================================
        class DatabaseManager {
            constructor() {
                this.dbName = 'warehouse_inventory_db';
                this.version = 1;
                this.db = null;
            }

            async init() {
                return new Promise((resolve, reject) => {
                    const request = indexedDB.open(this.dbName, this.version);

                    request.onerror = () => reject(request.error);
                    request.onsuccess = () => {
                        this.db = request.result;
                        resolve(this.db);
                    };

                    request.onupgradeneeded = (event) => {
                        const db = event.target.result;
                        
                        if (!db.objectStoreNames.contains('users')) {
                            const userStore = db.createObjectStore('users', { keyPath: 'id', autoIncrement: true });
                            userStore.createIndex('username', 'username', { unique: true });
                        }
                        if (!db.objectStoreNames.contains('warehouses')) {
                            const warehouseStore = db.createObjectStore('warehouses', { keyPath: 'id', autoIncrement: true });
                            warehouseStore.createIndex('name', 'name', { unique: true });
                        }
                        if (!db.objectStoreNames.contains('products')) {
                            const productStore = db.createObjectStore('products', { keyPath: 'id', autoIncrement: true });
                            productStore.createIndex('code', 'code', { unique: true });
                            productStore.createIndex('barcode', 'barcode', { unique: true });
                        }
                        if (!db.objectStoreNames.contains('counts')) {
                            const countStore = db.createObjectStore('counts', { keyPath: 'id', autoIncrement: true });
                            countStore.createIndex('warehouseId', 'warehouseId', { unique: false });
                            countStore.createIndex('productCode', 'productCode', { unique: false });
                            countStore.createIndex('date', 'date', { unique: false });
                        }
                        if (!db.objectStoreNames.contains('settings')) {
                            db.createObjectStore('settings', { keyPath: 'key' });
                        }
                    };
                });
            }

            async add(storeName, data) {
                const tx = this.db.transaction(storeName, 'readwrite');
                const store = tx.objectStore(storeName);
                return store.add({ ...data, createdAt: new Date().toISOString(), updatedAt: new Date().toISOString() });
            }

            async getAll(storeName) {
                const tx = this.db.transaction(storeName, 'readonly');
                const store = tx.objectStore(storeName);
                return store.getAll();
            }

            async get(storeName, id) {
                const tx = this.db.transaction(storeName, 'readonly');
                const store = tx.objectStore(storeName);
                return store.get(id);
            }

            async update(storeName, id, data) {
                const tx = this.db.transaction(storeName, 'readwrite');
                const store = tx.objectStore(storeName);
                const existing = await store.get(id);
                return store.put({ ...existing, ...data, updatedAt: new Date().toISOString() });
            }

            async delete(storeName, id) {
                const tx = this.db.transaction(storeName, 'readwrite');
                const store = tx.objectStore(storeName);
                return store.delete(id);
            }

            async clear(storeName) {
                const tx = this.db.transaction(storeName, 'readwrite');
                const store = tx.objectStore(storeName);
                return store.clear();
            }
        }

        const dbManager = new DatabaseManager();
        // Veritabanını başlat - hata durumunda localStorage'a geri dön

        // --- Firebase/Persistence Mock Implementation (localStorage) ---
        const initialData = {
            counts: {},
            currentUser: null,
            selectedWarehouse: null,
            language: 'tr', // Yeni: Dil ayarı
            darkMode: false, // Yeni: Tema ayarı
        };

        const loadDataFromStorage = () => {
            const stored = localStorage.getItem('depoSayimData');
            return stored ? { ...initialData, ...JSON.parse(stored) } : initialData;
        };

        const saveDataToStorage = (data) => {
            localStorage.setItem('depoSayimData', JSON.stringify(data));
        };
        
        const usePersistentState = (key, initialValue) => {
            const [state, setState] = useState(() => {
                const storedData = loadDataFromStorage();
                // Dil ve Tema için varsayılan değeri localStorage'dan yükle
                return storedData[key] !== undefined ? storedData[key] : initialValue;
            });

            const setPersistentState = (newValue) => {
                setState(newValue);
                const currentData = loadDataFromStorage();
                saveDataToStorage({ ...currentData, [key]: newValue });
            };

            return [state, setPersistentState];
        };
        
        const usePersistentCounts = () => {
            const [counts, setCounts] = usePersistentState('counts', {});

            const getCounts = (warehouseId) => {
                const warehouseKey = `warehouse_${warehouseId}`;
                return counts[warehouseKey] || [];
            };

            const addCount = (warehouseId, newCount) => {
                const warehouseKey = `warehouse_${warehouseId}`;
                const updatedCounts = [...getCounts(warehouseId), newCount];
                setCounts(prev => ({ ...prev, [warehouseKey]: updatedCounts }));
            };

            const updateCount = (warehouseId, updatedCount) => {
                const warehouseKey = `warehouse_${warehouseId}`;
                const updatedList = getCounts(warehouseId).map(c => 
                    c.id === updatedCount.id ? updatedCount : c
                );
                setCounts(prev => ({ ...prev, [warehouseKey]: updatedList }));
            };

            const deleteCount = (warehouseId, countId) => {
                const warehouseKey = `warehouse_${warehouseId}`;
                const updatedList = getCounts(warehouseId).filter(c => c.id !== countId);
                setCounts(prev => ({ ...prev, [warehouseKey]: updatedList }));
            };
            
            const clearCounts = (warehouseId) => {
                const warehouseKey = `warehouse_${warehouseId}`;
                setCounts(prev => {
                    const newCounts = { ...prev };
                    delete newCounts[warehouseKey];
                    return newCounts;
                });
            };

            return { counts: getCounts, addCount, updateCount, deleteCount, clearCounts };
        };

        // --- Chart Component (Değişmedi, dil desteği eklendi) ---
        const SimpleBarChart = React.memo(({ data, T }) => {
            if (!data || data.length === 0) return (
                <div className="text-center py-8 text-gray-500 italic">{T('noChartData')}</div>
            );

            const maxQuantity = Math.max(...data.map(d => d.quantity));
            const totalQuantity = data.reduce((sum, d) => sum + d.quantity, 0);

            return (
                <div className="space-y-4">
                    <p className="font-bold text-gray-800 text-lg border-b pb-2 dark:text-gray-200">{T('locationDistribution')}</p>
                    <div className="space-y-3">
                        {data.slice(0, 5).map((item, index) => (
                            <div key={item.location} className="flex flex-col">
                                <div className="flex justify-between text-xs font-medium text-gray-600 mb-1 dark:text-gray-400">
                                    <span>{item.location}</span>
                                    <span>{item.quantity} {T('unitsCounted')} ({((item.quantity / totalQuantity) * 100).toFixed(1)}%)</span>
                                </div>
                                <div className="w-full bg-gray-200 rounded-full h-3 shadow-inner">
                                    <div 
                                        className={`chart-bar h-full rounded-full shadow-md ${
                                            index === 0 ? 'bg-indigo-500' : index === 1 ? 'bg-purple-500' : index === 2 ? 'bg-green-500' : 'bg-gray-500'
                                        }`}
                                        style={{ width: `${(item.quantity / maxQuantity) * 100}%` }}
                                    ></div>
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
            );
        });

        // --- APP Component ---
        const App = () => {
            const [currentScreen, setCurrentScreen] = useState('login');
            const [currentUser, setCurrentUser] = usePersistentState('currentUser', null);
            const [selectedWarehouse, setSelectedWarehouse] = usePersistentState('selectedWarehouse', null);
            const [currentLanguage, setCurrentLanguage] = usePersistentState('language', 'tr'); // Yeni: Dil durumu
            const [darkMode, setDarkMode] = usePersistentState('darkMode', false); // Yeni: Tema durumu

            const T = useTranslation(currentLanguage); // Yeni: Çeviri hook'u

            const { counts: getCurrentCounts, addCount, updateCount, deleteCount, clearCounts } = usePersistentCounts();
            
            const [currentCount, setCurrentCount] = useState({
                barcode: '', productCode: '', productName: '', lotNumber: '', quantity: '', location: '', notes: ''
            });
            const [editingId, setEditingId] = useState(null);
            const [searchTerm, setSearchTerm] = useState('');
            const [showSuccess, setShowSuccess] = useState(false);
            const [filterCategory, setFilterCategory] = useState('all');
            const [filterStartDate, setFilterStartDate] = useState('');
            const [filterEndDate, setFilterEndDate] = useState('');
            const [sortBy, setSortBy] = useState('date');
            const [isLoading, setIsLoading] = useState(false);
            const [exportSuccess, setExportSuccess] = useState(false);
            const [lastDeletedCount, setLastDeletedCount] = useState(null);
            const [barcodeError, setBarcodeError] = useState(false); // Yeni: Barkod hata durumu

            const barcodeInputRef = useRef(null);

            // Karanlık mod ve gradient ayarı
            const appClassName = darkMode ? 'dark' : 'light';
            const bgGradient = darkMode ? 'from-slate-800 via-indigo-900 to-purple-900' : 'from-indigo-100 via-purple-50 to-pink-100';


            // --- RBAC Kontrol Fonksiyonları (Değişmedi) ---
            const isAdmin = currentUser?.permission === 'admin';
            const isManager = currentUser?.permission === 'manager';
            const canEditOrDelete = useCallback((count) => {
                if (!currentUser) return false;
                if (isAdmin || isManager) return true;
                return count.user === currentUser.name;
            }, [currentUser, isAdmin, isManager]);

            useEffect(() => {
                if (currentScreen === 'new-count' && barcodeInputRef.current) {
                    barcodeInputRef.current.focus();
                }
            }, [currentScreen]);
            
            // --- HANDLERS ---
            const handleLogin = (user) => {
                setIsLoading(true);
                setTimeout(() => {
                    setCurrentUser(user);
                    setCurrentScreen('warehouse-selection');
                    setIsLoading(false);
                }, 800);
            };

            const handleWarehouseSelect = (warehouse) => {
                setIsLoading(true);
                setTimeout(() => {
                    setSelectedWarehouse(warehouse);
                    setCurrentScreen('dashboard');
                    setIsLoading(false);
                }, 600);
            };

            // SIFIR HATA GİRİŞİ - Geliştirilmiş Barkod Kontrolü
            const parseBarcode = (barcode) => {
                const cleaned = barcode.replace(/\s/g, '');
                // Barkod formatı: En az 7 rakam (#) Lot Numarası
                const match = cleaned.match(/^(\d{7,})#(.+)$/); 
                
                let product = null;
                if (match) {
                    const productId = match[1];
                    product = MOCK_PRODUCTS[productId];
                    const lot = match[2];
                    
                    if (product) {
                        setCurrentCount(prev => ({
                            ...prev,
                            barcode: barcode,
                            productCode: product.code,
                            productName: product.name,
                            lotNumber: lot
                        }));
                        setBarcodeError(false);
                        return true; // Ürün bulundu
                    }
                }
                
                // Ürün bulunamadıysa veya format hatalıysa
                setCurrentCount(prev => ({
                    ...prev,
                    productCode: '',
                    productName: '',
                    lotNumber: ''
                }));
                if (barcode) { // Sadece boş değilse hata göster
                    setBarcodeError(true);
                } else {
                    setBarcodeError(false);
                }
                return false;
            };

            const handleSaveCount = () => {
                // SIFIR HATA GİRİŞİ - Zorunlu Alanlar Kontrolü
                if (!currentCount.quantity || !currentCount.location) {
                    alert(T('requiredFields'));
                    return;
                }
                
                // SIFIR HATA GİRİŞİ - Barkod ve Miktar Kontrolü
                if (!currentCount.productCode || barcodeError) {
                    alert(T('invalidBarcode'));
                    return;
                }
                const quantityInt = parseInt(currentCount.quantity);
                if (isNaN(quantityInt) || quantityInt <= 0) {
                     alert(T('tip3').replace('**positive integer**', T('positiveInteger'))); // Ekstra kontrol
                     return;
                }

                setIsLoading(true);
                setTimeout(() => {
                    const warehouseId = selectedWarehouse.id;
                    
                    if (editingId) {
                        const updated = { 
                            ...currentCount, 
                            id: editingId, 
                            quantity: String(quantityInt), // String olarak kaydet
                            updatedAt: new Date().toISOString(),
                            updatedBy: currentUser.name
                        };
                        updateCount(warehouseId, updated);
                        setEditingId(null);
                    } else {
                        const newCount = {
                            ...currentCount,
                            id: Date.now(),
                            quantity: String(quantityInt), // String olarak kaydet
                            timestamp: new Date().toISOString(),
                            user: currentUser.name,
                            updatedAt: null,
                            updatedBy: null
                        };
                        addCount(warehouseId, newCount);
                    }

                    setCurrentCount({
                        barcode: '', productCode: '', productName: '', lotNumber: '', quantity: '', location: '', notes: ''
                    });
                    
                    setShowSuccess(true);
                    setIsLoading(false);
                    setTimeout(() => {
                        setShowSuccess(false);
                        setCurrentScreen('dashboard');
                    }, 1500);
                }, 500);
            };

            const handleDelete = (count) => {
                if (!canEditOrDelete(count)) {
                    alert(T('noAuth'));
                    return;
                }

                if (!window.confirm(`${T('delete')}?`)) return;
                
                const warehouseId = selectedWarehouse.id;
                
                deleteCount(warehouseId, count.id);
                
                const deletedInfo = {
                    ...count, 
                    warehouseId: warehouseId
                };
                setLastDeletedCount(deletedInfo);
                
                setTimeout(() => {
                    setLastDeletedCount(null);
                }, 5000);
            };
            
            const handleUndoDelete = () => {
                if (!lastDeletedCount) return;
                
                const { warehouseId, ...rest } = lastDeletedCount;
                addCount(warehouseId, { 
                    ...rest, 
                    timestamp: new Date().toISOString(),
                    updatedAt: new Date().toISOString(),
                    updatedBy: currentUser.name 
                });
                
                setLastDeletedCount(null);
            };

            const handleEdit = (count) => {
                if (!canEditOrDelete(count)) {
                    alert(T('noAuth'));
                    return;
                }
                setCurrentCount(count);
                setEditingId(count.id);
                setCurrentScreen('new-count');
            };

            const handleExportToERP = () => {
                if (!isAdmin) {
                    alert(T('erpExportAuth'));
                    return;
                }

                const warehouseId = selectedWarehouse.id;
                const warehouseCounts = getCurrentCounts(warehouseId);
                
                if (warehouseCounts.length === 0) {
                    alert(T('exportNoData'));
                    return;
                }

                if (!window.confirm(T('exportConfirm', {
                    warehouseName: selectedWarehouse.name,
                    count: warehouseCounts.length
                }))) {
                    return;
                }

                // 1. CSV Oluşturma (Export İşlemi - Değişmedi)
                const csvContent = [
                    ['Depo', 'Barkod', 'Ürün Kodu', 'Ürün Adı', 'Lot No', 'Miktar', 'Lokasyon', 'Notlar', 'Sayım Yapan', 'Tarih'],
                    ...warehouseCounts.map(c => [
                        selectedWarehouse.name,
                        c.barcode,
                        c.productCode,
                        c.productName,
                        c.lotNumber, 
                        c.quantity,
                        c.location,
                        c.notes || '-',
                        c.user || currentUser.name,
                        new Date(c.timestamp).toLocaleString('tr-TR')
                    ])
                ].map(row => row.map(item => `"${item}"`).join(',')).join('\n');

                const blob = new Blob(['\ufeff' + csvContent], { type: 'text/csv;charset=utf-8;' });
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = `sayim_raporu_${selectedWarehouse.name}_${new Date().toISOString().split('T')[0]}.csv`;
                
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                
                // 2. Sayım Kayıtlarını Silme
                setIsLoading(true);
                setTimeout(() => {
                    clearCounts(warehouseId);
                    
                    setIsLoading(false);
                    setExportSuccess(true);
                    setTimeout(() => {
                        setExportSuccess(false);
                    }, 3000);
                }, 1000);
            };

            // PDF Export Function v3.0
            const handlePDFExport = () => {
                if (!selectedWarehouse) {
                    alert('Lütfen bir depo seçin!');
                    return;
                }

                const warehouseId = selectedWarehouse.id;
                const warehouseCounts = getCurrentCounts(warehouseId);
                
                if (warehouseCounts.length === 0) {
                    alert(T('exportNoData'));
                    return;
                }

                const data = {
                    counts: warehouseCounts,
                    warehouse: selectedWarehouse.name,
                    statistics: {
                        total: warehouseCounts.length,
                        totalQuantity: warehouseCounts.reduce((sum, c) => sum + (parseInt(c.quantity) || 0), 0),
                        uniqueProducts: new Set(warehouseCounts.map(c => c.productCode)).size
                    }
                };

                try {
                    // PDF Make'in yüklendiğini kontrol et
                    if (typeof pdfMake === 'undefined') {
                        alert('PDF kütüphanesi yükleniyor, lütfen birkaç saniye bekleyin ve tekrar deneyin.');
                        return;
                    }
                    const pdfDoc = generatePDFReport(data, T);
                    pdfDoc.download(`sayim_raporu_${selectedWarehouse.name}_${new Date().toISOString().split('T')[0]}.pdf`);
                } catch (error) {
                    console.error('PDF oluşturma hatası:', error);
                    alert('PDF oluşturulurken bir hata oluştu. Lütfen tekrar deneyin.');
                }
            };
            
            // --- FILTERS and MEMOS (Değişmedi, T eklendi) ---
            const allCounts = useMemo(() => {
                if (!selectedWarehouse) return [];
                return getCurrentCounts(selectedWarehouse.id);
            }, [getCurrentCounts, selectedWarehouse]);

            const filteredCounts = useMemo(() => {
                let filtered = allCounts;

                if (searchTerm) {
                    filtered = filtered.filter(c => 
                        c.productCode.toLowerCase().includes(searchTerm.toLowerCase()) ||
                        c.productName.toLowerCase().includes(searchTerm.toLowerCase()) ||
                        c.lotNumber.toLowerCase().includes(searchTerm.toLowerCase()) ||
                        c.location.toLowerCase().includes(searchTerm.toLowerCase())
                    );
                }

                if (filterCategory !== 'all') {
                    filtered = filtered.filter(c => {
                        const product = Object.values(MOCK_PRODUCTS).find(p => p.code === c.productCode);
                        return product && product.category === filterCategory;
                    });
                }
                
                if (filterStartDate && filterEndDate) {
                    const start = new Date(filterStartDate);
                    const end = new Date(filterEndDate);
                    end.setHours(23, 59, 59, 999);

                    filtered = filtered.filter(c => {
                        const countDate = new Date(c.timestamp);
                        return countDate >= start && countDate <= end;
                    });
                }

                if (sortBy === 'date') {
                    filtered.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
                } else if (sortBy === 'quantity') {
                    filtered.sort((a, b) => parseInt(b.quantity) - parseInt(a.quantity));
                } else if (sortBy === 'product') {
                    filtered.sort((a, b) => a.productName.localeCompare(b.productName));
                }

                return filtered;
            }, [allCounts, searchTerm, filterCategory, filterStartDate, filterEndDate, sortBy]);

            const stats = useMemo(() => {
                const total = allCounts.length;
                const totalQuantity = allCounts.reduce((sum, c) => sum + parseInt(c.quantity || 0), 0);
                const uniqueProducts = new Set(allCounts.map(c => c.productCode)).size;
                const todayCount = allCounts.filter(c => {
                    const today = new Date().toDateString();
                    return new Date(c.timestamp).toDateString() === today;
                }).length;
                
                const locationMap = allCounts.reduce((acc, c) => {
                    const loc = c.location || 'Bilinmeyen Lokasyon';
                    const qty = parseInt(c.quantity || 0);
                    acc[loc] = (acc[loc] || 0) + qty;
                    return acc;
                }, {});

                const chartData = Object.entries(locationMap)
                    .map(([location, quantity]) => ({ location, quantity }))
                    .sort((a, b) => b.quantity - a.quantity);


                return { total, totalQuantity, uniqueProducts, todayCount, chartData };
            }, [allCounts]);
            
            // --- SCREEN RENDERING ---

            // Ayarlar Ekranı (Yeni)
            if (currentScreen === 'settings') {
                return (
                    <div className={`min-h-screen bg-gradient-to-br ${darkMode ? 'from-gray-900 via-slate-900 to-indigo-900' : 'from-slate-50 via-blue-50 to-indigo-100'} p-4 transition-colors duration-500`}>
                        <div className="max-w-3xl mx-auto animate-fade-in">
                            <div className="bg-white/80 backdrop-blur-xl rounded-3xl shadow-2xl p-8 mb-6 border border-white/20 dark:bg-gray-800/80 dark:border-gray-700">
                                <div className="flex items-center gap-4 mb-8">
                                    <button
                                        onClick={() => setCurrentScreen('dashboard')}
                                        className="w-12 h-12 bg-gray-100 hover:bg-gray-200 rounded-xl flex items-center justify-center transition-all hover:scale-105 dark:bg-gray-700 dark:hover:bg-gray-600"
                                    >
                                        <ChevronRight size={24} className="dark:text-white" style={{ transform: 'rotate(180deg)' }} />
                                    </button>
                                    <h2 className="text-3xl font-bold bg-gradient-to-r from-indigo-600 to-purple-600 bg-clip-text text-transparent">
                                        {T('settings')}
                                    </h2>
                                </div>
                                
                                <div className="space-y-6">
                                    {/* Dil Ayarı */}
                                    <div className="bg-white/50 backdrop-blur-sm rounded-2xl p-6 shadow-md dark:bg-gray-900/50">
                                        <h3 className="text-xl font-bold text-gray-800 mb-4 dark:text-gray-200 flex items-center gap-2">
                                            <svg className="text-indigo-500" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path></svg>
                                            {T('language')}
                                        </h3>
                                        <div className="flex flex-col sm:flex-row gap-3">
                                            {['tr', 'en', 'de'].map(langCode => (
                                                <button
                                                    key={langCode}
                                                    onClick={() => setCurrentLanguage(langCode)}
                                                    className={`flex-1 px-6 py-4 rounded-xl font-bold transition-all duration-300 ${
                                                        currentLanguage === langCode
                                                            ? 'bg-indigo-500 text-white shadow-lg'
                                                            : 'bg-gray-100 text-gray-600 hover:bg-indigo-100 dark:bg-gray-700 dark:text-gray-200 dark:hover:bg-indigo-700'
                                                    }`}
                                                >
                                                    {langCode === 'tr' ? 'Türkçe' : langCode === 'en' ? 'English' : 'Deutsch'}
                                                </button>
                                            ))}
                                        </div>
                                    </div>

                                    {/* Tema Ayarı */}
                                    <div className="bg-white/50 backdrop-blur-sm rounded-2xl p-6 shadow-md dark:bg-gray-900/50">
                                        <h3 className="text-xl font-bold text-gray-800 mb-4 dark:text-gray-200 flex items-center gap-2">
                                            <Sun size={24} className="text-purple-500" />
                                            {T('theme')}
                                        </h3>
                                        <div className="flex flex-col sm:flex-row gap-3">
                                            <button
                                                onClick={() => setDarkMode(false)}
                                                className={`flex-1 px-6 py-4 rounded-xl font-bold transition-all duration-300 ${
                                                    !darkMode
                                                        ? 'bg-purple-500 text-white shadow-lg'
                                                        : 'bg-gray-100 text-gray-600 hover:bg-purple-100 dark:bg-gray-700 dark:text-gray-200 dark:hover:bg-purple-700'
                                                }`}
                                            >
                                                <Sun size={20} className="inline mr-2" />
                                                {T('lightMode')}
                                            </button>
                                            <button
                                                onClick={() => setDarkMode(true)}
                                                className={`flex-1 px-6 py-4 rounded-xl font-bold transition-all duration-300 ${
                                                    darkMode
                                                        ? 'bg-purple-500 text-white shadow-lg'
                                                        : 'bg-gray-100 text-gray-600 hover:bg-purple-100 dark:bg-gray-700 dark:text-gray-200 dark:hover:bg-purple-700'
                                                }`}
                                            >
                                                <Moon size={20} className="inline mr-2" />
                                                {T('darkMode')}
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                );
            }

            // Login Screen (Dil ve Tema Desteği Eklendi)
            if (currentScreen === 'login') {
                return (
                    <div className={`min-h-screen bg-gradient-to-br ${bgGradient} flex items-center justify-center p-4 relative overflow-hidden transition-colors duration-500 ${appClassName}`}>
                        <div className="absolute inset-0 overflow-hidden">
                            <div className="absolute -top-40 -right-40 w-80 h-80 bg-purple-300 rounded-full mix-blend-multiply filter blur-xl opacity-70 animate-pulse"></div>
                            <div className="absolute -bottom-40 -left-40 w-80 h-80 bg-blue-300 rounded-full mix-blend-multiply filter blur-xl opacity-70 animate-pulse" style={{animationDelay: '1s'}}></div>
                        </div>

                        <div className="relative bg-white/80 backdrop-blur-xl rounded-3xl shadow-2xl w-full max-w-md p-8 border border-white/20 animate-scale-in dark:bg-gray-800/80 dark:border-gray-700">
                            <div className="text-center mb-8">
                                <div className="inline-flex items-center justify-center w-24 h-24 bg-gradient-to-br from-indigo-500 via-purple-500 to-pink-500 rounded-3xl mb-4 shadow-2xl floating">
                                    <Package size={48} className="text-white" />
                                </div>
                                <h1 className="text-4xl font-bold bg-gradient-to-r from-indigo-600 via-purple-600 to-pink-600 bg-clip-text text-transparent mb-2">
                                    {T('appTitle')}
                                </h1>
                                <p className="text-gray-600 font-medium dark:text-gray-400">v2.0 {T('edition')}</p>
                                <p className="text-gray-500 text-sm mt-2">{T('loginInfo')}</p>
                            </div>
                            
                            {isLoading ? (
                                <div className="space-y-3">
                                    {[1, 2, 3].map(i => (
                                        <div key={i} className="skeleton rounded-xl h-20"></div>
                                    ))}
                                </div>
                            ) : (
                                <div className="space-y-3">
                                    {MOCK_USERS.map((user, index) => (
                                        <button
                                            key={user.id}
                                            onClick={() => handleLogin(user)}
                                            className="w-full bg-white/60 hover:bg-white/80 backdrop-blur-sm border-2 border-gray-200/50 hover:border-purple-300 rounded-2xl p-5 transition-all duration-300 group card-hover dark:bg-gray-900/60 dark:hover:bg-gray-900/80 dark:border-gray-700 dark:hover:border-indigo-500"
                                            style={{animationDelay: `${index * 0.1}s`}}
                                        >
                                            <div className="flex items-center justify-between">
                                                <div className="flex items-center gap-4">
                                                    <div className={`w-14 h-14 bg-gradient-to-br ${user.color} rounded-2xl flex items-center justify-center text-white font-bold text-lg shadow-lg`}>
                                                        {user.avatar}
                                                    </div>
                                                    <div className="text-left">
                                                        <p className="font-bold text-gray-800 text-lg dark:text-gray-100">{user.name}</p>
                                                        <p className="text-sm text-gray-600 font-medium dark:text-gray-400">{user.role} <span className="text-xs text-gray-400">({user.permission})</span></p>
                                                    </div>
                                                </div>
                                                <ChevronRight className="text-gray-400 group-hover:text-purple-600 group-hover:translate-x-1 transition-all" size={24} />
                                            </div>
                                        </button>
                                    ))}
                                </div>
                            )}

                            <div className="mt-8 pt-6 border-t border-gray-200 dark:border-gray-700">
                                <div className="flex items-center justify-center gap-2 text-gray-500 text-xs dark:text-gray-400">
                                    <div className="w-2 h-2 bg-green-500 rounded-full animate-pulse"></div>
                                    <span>{T('systemActive')}</span>
                                </div>
                                <div className="mt-3 flex justify-center">
                                    <button
                                        onClick={() => setCurrentLanguage(currentLanguage === 'tr' ? 'en' : currentLanguage === 'en' ? 'de' : 'tr')}
                                        className="text-xs font-semibold text-indigo-500 hover:text-indigo-700 transition-colors"
                                    >
                                        {T('languageSelect')}: {currentLanguage.toUpperCase()}
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                );
            }

            // Warehouse Selection Screen (Dil ve Tema Desteği Eklendi)
            if (currentScreen === 'warehouse-selection') {
                return (
                    <div className={`min-h-screen bg-gradient-to-br ${darkMode ? 'from-slate-800 via-blue-900 to-indigo-900' : 'from-slate-50 via-blue-50 to-indigo-100'} p-4 transition-colors duration-500 ${appClassName}`}>
                        <div className="max-w-6xl mx-auto animate-fade-in">
                            <div className="bg-white/80 backdrop-blur-xl rounded-3xl shadow-2xl p-8 mb-8 border border-white/20 dark:bg-gray-800/80 dark:border-gray-700">
                                <div className="flex items-center justify-between">
                                    <div className="flex items-center gap-4">
                                        <div className="w-16 h-16 bg-gradient-to-br from-blue-500 to-indigo-600 rounded-2xl flex items-center justify-center shadow-xl">
                                            <Package size={32} className="text-white" />
                                        </div>
                                        <div>
                                            <h2 className="text-3xl font-bold text-gray-800 dark:text-gray-100">{T('warehouseSelection')}</h2>
                                            <p className="text-gray-600 mt-1 flex items-center gap-2 dark:text-gray-400">
                                                {T('welcome')}, <span className="font-semibold text-indigo-600">{currentUser.name}</span>
                                            </p>
                                        </div>
                                    </div>
                                    <button
                                        onClick={() => setCurrentScreen('login')}
                                        className="flex items-center gap-2 px-5 py-3 text-red-600 hover:bg-red-50 rounded-xl transition-all duration-300 font-semibold dark:hover:bg-red-900/50 dark:text-red-400"
                                    >
                                        <LogOut size={20} />
                                        {T('exit')}
                                    </button>
                                </div>
                            </div>

                            {isLoading ? (
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                    {[1, 2, 3, 4].map(i => (
                                        <div key={i} className="skeleton rounded-2xl h-48"></div>
                                    ))}
                                </div>
                            ) : (
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                    {MOCK_WAREHOUSES.map((warehouse, index) => (
                                        <button
                                            key={warehouse.id}
                                            onClick={() => warehouse.status === 'active' && handleWarehouseSelect(warehouse)}
                                            disabled={warehouse.status !== 'active'}
                                            className={`bg-white/80 backdrop-blur-sm rounded-2xl p-8 shadow-xl transition-all duration-300 border-2 text-left dark:bg-gray-800/80 dark:border-gray-700 ${
                                                warehouse.status === 'active' 
                                                    ? 'border-transparent hover:border-indigo-300 card-hover cursor-pointer dark:hover:border-indigo-500' 
                                                    : 'border-orange-300 opacity-75 cursor-not-allowed dark:border-orange-500'
                                            }`}
                                            style={{animationDelay: `${index * 0.1}s`}}
                                        >
                                            <div className="flex items-start justify-between mb-6">
                                                <div className="flex items-center gap-4">
                                                    <div className={`w-16 h-16 bg-gradient-to-br ${
                                                        warehouse.status === 'active' 
                                                            ? 'from-blue-400 to-indigo-600' 
                                                            : 'from-orange-400 to-red-500'
                                                    } rounded-2xl flex items-center justify-center shadow-lg`}>
                                                        <Package size={32} className="text-white" />
                                                    </div>
                                                    <div>
                                                        <h3 className="text-2xl font-bold text-gray-800 dark:text-gray-100">{warehouse.name}</h3>
                                                        <p className="text-gray-600 flex items-center gap-1.5 text-sm mt-1 dark:text-gray-400">
                                                            <MapPin size={16} />
                                                            {warehouse.location} • {warehouse.area}
                                                        </p>
                                                    </div>
                                                </div>
                                                {warehouse.status === 'active' ? (
                                                    <ChevronRight className="text-gray-400 group-hover:text-indigo-600 transition-colors" size={24} />
                                                ) : (
                                                    <span className="px-3 py-1 bg-orange-100 text-orange-700 rounded-full text-xs font-semibold dark:bg-orange-900/50 dark:text-orange-300">
                                                        {T('statusMaintenance')}
                                                    </span>
                                                )}
                                            </div>
                                            
                                            <div className="space-y-3">
                                                <div className="flex items-center justify-between text-sm">
                                                    <span className="text-gray-600 font-medium dark:text-gray-400">{T('capacity')}</span>
                                                    <span className="font-bold text-gray-800 text-lg dark:text-gray-100">{warehouse.capacity}%</span>
                                                </div>
                                                <div className="relative w-full bg-gray-200 rounded-full h-4 overflow-hidden shadow-inner dark:bg-gray-700">
                                                    <div 
                                                        className={`progress-bar h-full rounded-full shadow-lg ${
                                                            warehouse.capacity > 80 
                                                                ? 'bg-gradient-to-r from-red-500 to-orange-500' 
                                                                : warehouse.capacity > 60 
                                                                ? 'bg-gradient-to-r from-yellow-500 to-orange-500'
                                                                : 'bg-gradient-to-r from-green-500 to-emerald-500'
                                                        }`}
                                                        style={{ width: `${warehouse.capacity}%` }}
                                                    />
                                                </div>
                                                <div className="flex items-center gap-3 text-xs text-gray-600 pt-2 dark:text-gray-400">
                                                    <span className="flex items-center gap-1">
                                                        <div className="w-2 h-2 bg-blue-500 rounded-full"></div>
                                                        {warehouse.type}
                                                    </span>
                                                    <span className="flex items-center gap-1">
                                                        <div className={`w-2 h-2 ${warehouse.status === 'active' ? 'bg-green-500' : 'bg-orange-500'} rounded-full animate-pulse`}></div>
                                                        {warehouse.status === 'active' ? T('statusActive') : T('statusMaintenance')}
                                                    </span>
                                                </div>
                                            </div>
                                        </button>
                                    ))}
                                </div>
                            )}
                        </div>
                    </div>
                );
            }

            // Dashboard Screen (Dil, Tema ve Ayarlar Butonu Eklendi)
            if (currentScreen === 'dashboard') {
                const isAdminOrManager = isAdmin || isManager;

                return (
                    <div className={`min-h-screen bg-gradient-to-br ${darkMode ? 'from-slate-800 via-blue-900 to-indigo-900' : 'from-slate-50 via-blue-50 to-indigo-100'} p-4 transition-colors duration-500 ${appClassName}`}>
                        <div className="max-w-7xl mx-auto">
                            {/* Header */}
                            <div className="bg-white/80 backdrop-blur-xl rounded-3xl shadow-2xl p-6 mb-6 border border-white/20 animate-slide-down dark:bg-gray-800/80 dark:border-gray-700">
                                <div className="flex items-center justify-between flex-wrap gap-4">
                                    <div className="flex items-center gap-4">
                                        <button
                                            onClick={() => {
                                                setSelectedWarehouse(null);
                                                setCurrentScreen('warehouse-selection');
                                            }}
                                            className="w-12 h-12 bg-gray-100 hover:bg-gray-200 rounded-xl flex items-center justify-center transition-all hover:scale-105 dark:bg-gray-700 dark:hover:bg-gray-600"
                                        >
                                            <ChevronRight size={24} className="dark:text-white" style={{ transform: 'rotate(180deg)' }} />
                                        </button>
                                        <div>
                                            <h1 className="text-3xl font-bold bg-gradient-to-r from-indigo-600 to-purple-600 bg-clip-text text-transparent">
                                                {selectedWarehouse.name}
                                            </h1>
                                            <p className="text-gray-600 text-sm flex items-center gap-2 mt-1 dark:text-gray-400">
                                                <MapPin size={14} />
                                                {selectedWarehouse.location} • {currentUser.name} ({currentUser.role})
                                            </p>
                                        </div>
                                    </div>
                                    <div className="flex items-center gap-3">
                                        {/* Yeni Ayarlar Butonu */}
                                        <button
                                            onClick={() => setCurrentScreen('settings')}
                                            className="relative p-3 bg-gray-100 hover:bg-gray-200 rounded-xl transition-all hover:scale-105 dark:bg-gray-700 dark:hover:bg-gray-600"
                                        >
                                            <Settings size={20} className="dark:text-white" />
                                        </button>
                                        <button
                                            // Notification Logic kaldırıldı, sadece ikon kaldı.
                                            className="relative p-3 bg-gray-100 hover:bg-gray-200 rounded-xl transition-all hover:scale-105 dark:bg-gray-700 dark:hover:bg-gray-600"
                                        >
                                            <Bell size={20} className="dark:text-white" />
                                            {stats.todayCount > 0 && (
                                                <span className="absolute -top-1 -right-1 w-5 h-5 bg-red-500 text-white text-xs rounded-full flex items-center justify-center font-bold animate-pulse">
                                                    {stats.todayCount}
                                                </span>
                                            )}
                                        </button>
                                        <button
                                            onClick={() => setCurrentScreen('login')}
                                            className="flex items-center gap-2 px-5 py-3 text-red-600 hover:bg-red-50 rounded-xl transition-all font-semibold dark:hover:bg-red-900/50 dark:text-red-400"
                                        >
                                            <LogOut size={20} />
                                            {T('exit')}
                                        </button>
                                    </div>
                                </div>
                            </div>
                            
                            {/* Export Success Message */}
                            {exportSuccess && (
                                <div className="mb-6 p-5 bg-gradient-to-r from-emerald-500 to-green-600 text-white rounded-2xl flex items-center gap-4 shadow-xl animate-slide-down max-w-7xl mx-auto">
                                    <div className="w-12 h-12 bg-white/20 backdrop-blur-sm rounded-xl flex items-center justify-center">
                                        <Check size={24} />
                                    </div>
                                    <div>
                                        <p className="font-bold text-lg">{T('exportSuccessTitle')}</p>
                                        <p className="text-white/90 text-sm">{T('exportSuccessText')}</p>
                                    </div>
                                </div>
                            )}

                            {/* Geri Alma Bildirimi */}
                            {lastDeletedCount && (
                                <div className="fixed bottom-6 left-1/2 transform -translate-x-1/2 p-4 bg-yellow-500 text-white rounded-xl shadow-2xl z-50 flex items-center gap-4 animate-scale-in">
                                    <Trash2 size={24} className="text-white" />
                                    <p className="font-medium text-sm">{lastDeletedCount.productName} {T('undoNotification')}</p>
                                    <button
                                        onClick={handleUndoDelete}
                                        className="px-4 py-2 bg-white text-yellow-500 font-bold rounded-lg hover:bg-gray-100 transition-all text-sm"
                                    >
                                        {T('undoButton')} ({lastDeletedCount.id ? 5 : 0}s)
                                    </button>
                                </div>
                            )}

                            {/* Stats Cards and Chart (T eklendi) */}
                            <div className="grid grid-cols-1 lg:grid-cols-12 gap-6 mb-6">
                                {/* Stats Cards (4x) */}
                                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 col-span-12 xl:col-span-8 gap-6">
                                    <div className="bg-gradient-to-br from-blue-500 to-indigo-600 rounded-2xl p-6 text-white shadow-xl card-hover animate-slide-up">
                                        <div className="flex items-center justify-between mb-3">
                                            <div>
                                                <p className="text-blue-100 text-sm font-medium">{T('totalCounts')}</p>
                                                <p className="text-4xl font-bold mt-2">{stats.total}</p>
                                            </div>
                                            <div className="w-14 h-14 bg-white/20 backdrop-blur-sm rounded-xl flex items-center justify-center">
                                                <Package size={28} />
                                            </div>
                                        </div>
                                        <div className="flex items-center gap-2 text-blue-100 text-xs">
                                            <TrendingUp size={14} />
                                            <span>{T('audit')}</span>
                                        </div>
                                    </div>
                                    
                                    <div className="bg-gradient-to-br from-green-500 to-emerald-600 rounded-2xl p-6 text-white shadow-xl card-hover animate-slide-up" style={{animationDelay: '0.1s'}}>
                                        <div className="flex items-center justify-between mb-3">
                                            <div>
                                                <p className="text-green-100 text-sm font-medium">{T('totalQuantity')}</p>
                                                <p className="text-4xl font-bold mt-2">{stats.totalQuantity}</p>
                                            </div>
                                            <div className="w-14 h-14 bg-white/20 backdrop-blur-sm rounded-xl flex items-center justify-center">
                                                <BarChart3 size={28} />
                                            </div>
                                        </div>
                                        <div className="flex items-center gap-2 text-green-100 text-xs">
                                            <Package size={14} />
                                            <span>{T('unitsCounted')}</span>
                                        </div>
                                    </div>
                                    
                                    <div className="bg-gradient-to-br from-purple-500 to-pink-600 rounded-2xl p-6 text-white shadow-xl card-hover animate-slide-up" style={{animationDelay: '0.2s'}}>
                                        <div className="flex items-center justify-between mb-3">
                                            <div>
                                                <p className="text-purple-100 text-sm font-medium">{T('uniqueProducts')}</p>
                                                <p className="text-4xl font-bold mt-2">{stats.uniqueProducts}</p>
                                            </div>
                                            <div className="w-14 h-14 bg-white/20 backdrop-blur-sm rounded-xl flex items-center justify-center">
                                                <FileText size={28} />
                                            </div>
                                        </div>
                                        <div className="flex items-center gap-2 text-purple-100 text-xs">
                                            <Check size={14} />
                                            <span>{T('productVariety')}</span>
                                        </div>
                                    </div>

                                    <div className="bg-gradient-to-br from-orange-500 to-red-600 rounded-2xl p-6 text-white shadow-xl card-hover animate-slide-up" style={{animationDelay: '0.3s'}}>
                                        <div className="flex items-center justify-between mb-3">
                                            <div>
                                                <p className="text-orange-100 text-sm font-medium">{T('today')}</p>
                                                <p className="text-4xl font-bold mt-2">{stats.todayCount}</p>
                                            </div>
                                            <div className="w-14 h-14 bg-white/20 backdrop-blur-sm rounded-xl flex items-center justify-center">
                                                <Clock size={28} />
                                            </div>
                                        </div>
                                        <div className="flex items-center gap-2 text-orange-100 text-xs">
                                            <Calendar size={14} />
                                            <span>{T('dailyCount')}</span>
                                        </div>
                                    </div>
                                </div>
                                
                                {/* Chart Card */}
                                <div className="col-span-12 xl:col-span-4 bg-white/80 backdrop-blur-xl rounded-3xl shadow-2xl p-6 border border-white/20 card-hover animate-slide-up dark:bg-gray-800/80 dark:border-gray-700" style={{animationDelay: '0.4s'}}>
                                    <SimpleBarChart data={stats.chartData} T={T} />
                                </div>
                            </div>

                            {/* Action Buttons */}
                            <div className="grid grid-cols-1 md:grid-cols-3 gap-6 mb-6">
                                <button
                                    onClick={() => setCurrentScreen('new-count')}
                                    className="btn-primary text-white rounded-2xl p-8 shadow-2xl flex items-center justify-center gap-4 group"
                                >
                                    <div className="w-14 h-14 bg-white/20 backdrop-blur-sm rounded-xl flex items-center justify-center group-hover:scale-110 transition-transform">
                                        <Camera size={28} />
                                    </div>
                                    <div className="text-left">
                                        <p className="text-2xl font-bold">{T('newCount')}</p>
                                        <p className="text-white/80 text-sm mt-1">{T('barcodeScan').replace('*', '')}</p>
                                    </div>
                                </button>
                                
                                <button
                                    onClick={handlePDFExport}
                                    disabled={stats.total === 0}
                                    className="bg-gradient-to-r from-red-500 to-pink-600 hover:from-red-600 hover:to-pink-700 disabled:from-gray-300 disabled:to-gray-400 text-white rounded-2xl p-8 shadow-2xl transition-all duration-300 hover:-translate-y-1 disabled:cursor-not-allowed flex items-center justify-center gap-4 group"
                                >
                                    <div className="w-14 h-14 bg-white/20 backdrop-blur-sm rounded-xl flex items-center justify-center group-hover:scale-110 transition-transform">
                                        <FileText size={28} />
                                    </div>
                                    <div className="text-left">
                                        <p className="text-2xl font-bold">PDF Export</p>
                                        <p className="text-white/80 text-sm mt-1">Professional PDF Report</p>
                                    </div>
                                </button>
                                
                                <button
                                    onClick={handleExportToERP}
                                    disabled={stats.total === 0 || isLoading || !isAdmin}
                                    className={`bg-gradient-to-r ${isAdmin ? 'from-green-500 to-emerald-600 hover:from-green-600 hover:to-emerald-700' : 'from-gray-400 to-gray-500'} disabled:from-gray-300 disabled:to-gray-400 text-white rounded-2xl p-8 shadow-2xl transition-all duration-300 hover:-translate-y-1 disabled:cursor-not-allowed flex items-center justify-center gap-4 group`}
                                >
                                    <div className="w-14 h-14 bg-white/20 backdrop-blur-sm rounded-xl flex items-center justify-center group-hover:scale-110 transition-transform">
                                        {isLoading ? (
                                            <div className="w-8 h-8 border-4 border-white border-t-transparent rounded-full animate-spin"></div>
                                        ) : (
                                            <Download size={28} />
                                        )}
                                    </div>
                                    <div className="text-left">
                                        <p className="text-2xl font-bold">{T('erpExport')}</p>
                                        <p className="text-white/80 text-sm mt-1">{isAdmin ? T('erpExportInfo') : T('erpExportAuth')}</p>
                                    </div>
                                </button>
                            </div>

                            {/* Records Section */}
                            <div className="bg-white/80 backdrop-blur-xl rounded-3xl shadow-2xl p-8 border border-white/20 dark:bg-gray-800/80 dark:border-gray-700">
                                <div className="flex flex-col lg:flex-row items-start lg:items-center justify-between mb-6 gap-4">
                                    <h2 className="text-2xl font-bold text-gray-800 dark:text-gray-100">{T('records')} ({filteredCounts.length})</h2>
                                    
                                    <div className="flex items-center gap-3 flex-wrap">
                                        <div className="relative">
                                            <Search className="absolute left-4 top-1/2 transform -translate-y-1/2 text-gray-400" size={20} />
                                            <input
                                                type="text"
                                                placeholder={T('searchPlaceholder')}
                                                value={searchTerm}
                                                onChange={(e) => setSearchTerm(e.target.value)}
                                                className="pl-12 pr-4 py-3 border-2 border-gray-200 rounded-xl focus:border-indigo-500 focus:outline-none transition-all w-full md:w-64 bg-white/50 backdrop-blur-sm dark:bg-gray-700 dark:border-gray-600 dark:text-gray-200"
                                            />
                                        </div>
                                        
                                        <select
                                            value={filterCategory}
                                            onChange={(e) => setFilterCategory(e.target.value)}
                                            className="px-4 py-3 border-2 border-gray-200 rounded-xl focus:border-indigo-500 focus:outline-none transition-all bg-white/50 backdrop-blur-sm font-medium dark:bg-gray-700 dark:border-gray-600 dark:text-gray-200"
                                        >
                                            <option value="all">{T('allCategories')}</option>
                                            <option value="Kategori A">Kategori A</option>
                                            <option value="Kategori B">Kategori B</option>
                                        </select>
                                        
                                        <div className="flex gap-2">
                                            <input
                                                type="date"
                                                value={filterStartDate}
                                                onChange={(e) => setFilterStartDate(e.target.value)}
                                                className="px-4 py-3 border-2 border-gray-200 rounded-xl focus:border-indigo-500 focus:outline-none transition-all bg-white/50 backdrop-blur-sm font-medium dark:bg-gray-700 dark:border-gray-600 dark:text-gray-200"
                                                title={T('filterStartDate')}
                                            />
                                            <input
                                                type="date"
                                                value={filterEndDate}
                                                onChange={(e) => setFilterEndDate(e.target.value)}
                                                className="px-4 py-3 border-2 border-gray-200 rounded-xl focus:border-indigo-500 focus:outline-none transition-all bg-white/50 backdrop-blur-sm font-medium dark:bg-gray-700 dark:border-gray-600 dark:text-gray-200"
                                                title={T('filterEndDate')}
                                            />
                                        </div>

                                        <select
                                            value={sortBy}
                                            onChange={(e) => setSortBy(e.target.value)}
                                            className="px-4 py-3 border-2 border-gray-200 rounded-xl focus:border-indigo-500 focus:outline-none transition-all bg-white/50 backdrop-blur-sm font-medium dark:bg-gray-700 dark:border-gray-600 dark:text-gray-200"
                                        >
                                            <option value="date">{T('sortByDate')}</option>
                                            <option value="quantity">{T('sortByQuantity')}</option>
                                            <option value="product">{T('sortByProduct')}</option>
                                        </select>
                                    </div>
                                </div>

                                {filteredCounts.length === 0 ? (
                                    <div className="text-center py-20">
                                        <div className="w-24 h-24 bg-gradient-to-br from-gray-100 to-gray-200 rounded-3xl mx-auto mb-6 flex items-center justify-center dark:from-gray-700 dark:to-gray-800">
                                            <Package size={48} className="text-gray-400" />
                                        </div>
                                        <p className="text-gray-500 text-lg font-medium dark:text-gray-400">
                                            {searchTerm || filterCategory !== 'all' || (filterStartDate && filterEndDate)
                                                ? T('noFilterRecords') 
                                                : T('noRecords')}
                                        </p>
                                        <p className="text-gray-400 text-sm mt-2">{T('tip2').replace('Barkod okuyucu ile barkodu okutun, miktar ve lokasyonu girerek hızlıca kaydedin', 'İlk kaydınızı oluşturmak için "Yeni Sayım Kaydı" butonunu kullanın')}</p>
                                    </div>
                                ) : (
                                    <div className="space-y-4 max-h-[500px] overflow-y-auto custom-scrollbar pr-2">
                                        {filteredCounts.map((count, index) => (
                                            <div 
                                                key={count.id} 
                                                className="bg-gradient-to-r from-white to-gray-50 rounded-2xl p-6 border-2 border-gray-200 hover:border-indigo-300 transition-all duration-300 card-hover dark:from-gray-900/50 dark:to-gray-900 dark:border-gray-700 dark:hover:border-indigo-500"
                                                style={{animationDelay: `${index * 0.05}s`}}
                                            >
                                                <div className="flex items-start justify-between gap-4">
                                                    <div className="flex-1">
                                                        <div className="flex items-center gap-2 mb-3 flex-wrap">
                                                            <span className="px-4 py-1.5 bg-gradient-to-r from-blue-500 to-indigo-600 text-white rounded-full text-sm font-bold shadow-md">
                                                                {count.productCode}
                                                            </span>
                                                            <span className="px-4 py-1.5 bg-gradient-to-r from-purple-500 to-pink-600 text-white rounded-full text-sm font-bold shadow-md">
                                                                Lot: {count.lotNumber}
                                                            </span>
                                                            <span className="px-3 py-1 bg-gray-200 text-gray-700 rounded-full text-xs font-semibold dark:bg-gray-700 dark:text-gray-300">
                                                                <Clock size={12} className="inline-block mr-1 text-gray-500 dark:text-gray-400" />
                                                                {new Date(count.timestamp).toLocaleString(currentLanguage + '-' + currentLanguage.toUpperCase(), { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit'})}
                                                            </span>
                                                        </div>
                                                        <p className="font-bold text-gray-800 text-lg mb-3 dark:text-gray-100">{count.productName}</p>
                                                        <div className="grid grid-cols-2 md:grid-cols-4 gap-4 text-sm">
                                                            <div className="flex items-center gap-2 text-gray-700 dark:text-gray-300">
                                                                <Package size={16} className="text-indigo-500" />
                                                                <span className="font-medium">{T('quantity')}:</span>
                                                                <strong className="text-indigo-600">{count.quantity}</strong>
                                                            </div>
                                                            <div className="flex items-center gap-2 text-gray-700 dark:text-gray-300">
                                                                <MapPin size={16} className="text-green-500" />
                                                                <span className="font-medium">{T('location')}:</span>
                                                                <strong className="text-green-600">{count.location}</strong>
                                                            </div>
                                                            <div className="flex items-center gap-2 text-gray-700 dark:text-gray-300">
                                                                <div className="w-4 h-4 bg-purple-500 rounded-full"></div>
                                                                <span className="text-xs font-medium">{count.user}</span>
                                                            </div>
                                                            {count.updatedAt && (
                                                                <div className="flex items-center gap-2 text-gray-700 dark:text-gray-300">
                                                                    <RefreshCw size={14} className="text-orange-500" />
                                                                    <span className="text-xs text-orange-600 dark:text-orange-400" title={`Son Güncelleme: ${new Date(count.updatedAt).toLocaleString(currentLanguage + '-' + currentLanguage.toUpperCase())}`}>
                                                                        {T('updated')}
                                                                    </span>
                                                                </div>
                                                            )}
                                                        </div>
                                                        {count.notes && (
                                                            <div className="mt-3 pt-3 border-t border-gray-200 dark:border-gray-700">
                                                                <p className="text-sm text-gray-600 italic dark:text-gray-400">{T('notes').replace('(Opsiyonel)', '')}: {count.notes}</p>
                                                            </div>
                                                        )}
                                                    </div>
                                                    <div className="flex gap-2">
                                                        <button
                                                            onClick={() => handleEdit(count)}
                                                            disabled={!canEditOrDelete(count)}
                                                            className={`p-3 ${canEditOrDelete(count) ? 'bg-blue-100 hover:bg-blue-200 text-blue-600 hover:scale-110 dark:bg-blue-900/50 dark:hover:bg-blue-900 dark:text-blue-300' : 'bg-gray-100 text-gray-400 cursor-not-allowed dark:bg-gray-700 dark:text-gray-500'} rounded-xl transition-all`}
                                                            title={canEditOrDelete(count) ? T('edit') : T('noAuth')}
                                                        >
                                                            <Edit size={20} />
                                                        </button>
                                                        <button
                                                            onClick={() => handleDelete(count)}
                                                            disabled={!canEditOrDelete(count)}
                                                            className={`p-3 ${canEditOrDelete(count) ? 'bg-red-100 hover:bg-red-200 text-red-600 hover:scale-110 dark:bg-red-900/50 dark:hover:bg-red-900 dark:text-red-300' : 'bg-gray-100 text-gray-400 cursor-not-allowed dark:bg-gray-700 dark:text-gray-500'} rounded-xl transition-all`}
                                                            title={canEditOrDelete(count) ? T('delete') : T('noAuth')}
                                                        >
                                                            <Trash2 size={20} />
                                                        </button>
                                                    </div>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </div>
                        </div>
                    </div>
                );
            }

            // New Count Screen (Dil, Tema ve Sıfır Hata Validasyonu Eklendi)
            if (currentScreen === 'new-count') {
                const productInfo = currentCount.productCode ? MOCK_PRODUCTS[Object.keys(MOCK_PRODUCTS).find(key => MOCK_PRODUCTS[key].code === currentCount.productCode)] : null;
                const isProductFound = !!productInfo;
                const isInvalidBarcode = currentCount.barcode && barcodeError; // Hata durumunu kullan
                const isInvalidQuantity = currentCount.quantity && (parseInt(currentCount.quantity) <= 0 || isNaN(parseInt(currentCount.quantity)));

                return (
