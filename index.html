<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Warehouse Inventory Count</title>
  <meta name="description" content="Browser-based warehouse stock counting: barcode counting sessions, discrepancy review, PDF and CSV reports. Demo mode, data stays in your browser.">
  <meta name="theme-color" content="#1d4ed8">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/styles.css">
  <script>
    // Apply the saved theme before first paint to avoid a flash.
    try {
      var prefs = JSON.parse(localStorage.getItem('wic.prefs.v1') || '{}');
      var theme = prefs.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.dataset.theme = theme;
    } catch (e) { /* ignore */ }
  </script>
</head>
<body>
  <div id="app">
    <div class="splash" role="status">
      <span class="spinner" aria-hidden="true"></span>
      <span>Loading…</span>
    </div>
  </div>
  <noscript><p class="boot-error">This application needs JavaScript.</p></noscript>
  <script>
    // ES modules cannot be loaded from file:// URLs, so explain how to run the app instead of hanging.
    if (location.protocol === 'file:') {
      document.getElementById('app').innerHTML =
        '<p class="boot-error" role="alert">Open this app through a web server (for example <code>npm start</code> and then open localhost:8080). Browsers block ES modules on file:// URLs.</p>';
    }
  </script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
